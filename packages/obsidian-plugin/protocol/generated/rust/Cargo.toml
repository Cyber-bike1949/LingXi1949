[package]
name = "termy-protocol"
version = "1.0.0"
edition = "2021"
rust-version = "1.97.1"
description = "Generated Rust types for the Termy remote protocol (schema package 1.0.0, protocolVersion 1)"

# src/messages.rs is generated by `npm run generate:rust` in protocol/ and must
# not be hand-edited. Everything else in this crate is hand-written glue.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde", "clock"] }
regress = "=0.10.4"

# Runtime Draft 2020-12 validation against the very same bundled schema the Node
# side uses. serde alone is not enough: typify maps `minimum: 1` to NonZeroU64
# but silently drops `maximum`, so a struct-only check would accept cols: 99999
# while ajv rejects it. Validating the real schema removes that divergence by
# construction instead of by hand-maintained bound checks.
jsonschema = { version = "=0.49.2", default-features = false }

[dev-dependencies]
uuid = { version = "=1.20.0", features = ["v4"] }
serde_json = "=1.0.149"
