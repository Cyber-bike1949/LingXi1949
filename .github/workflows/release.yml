name: Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Check tag and release metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = process.env.RELEASE_VERSION;
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const changelogHeading = new RegExp(`^## \\[${escapedVersion}\\](?:\\s+-\\s+.+)?$`, 'm');

          if (manifest.version !== version || packageJson.version !== version) {
            throw new Error(
              `Tag ${version} must match manifest.json (${manifest.version}) and package.json (${packageJson.version})`
            );
          }
          if (!changelogHeading.test(changelog)) {
            throw new Error(`CHANGELOG.md is missing a ## [${version}] section`);
          }
          NODE

  build-rust:
    name: Build Rust ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ''

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-servers -> target
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v5
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'

      - name: Setup Node.js
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Build
        working-directory: rust-servers
        env:
          TERMINAL_SERVER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p binaries
          BINARY_NAME="termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "rust-servers/target/${{ matrix.target }}/release/termy-server${{ matrix.ext }}" "binaries/${BINARY_NAME}"
          
          cd binaries
          if command -v sha256sum &> /dev/null; then
            sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          else
            shasum -a 256 "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          fi

      - name: Build complete plugin package
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm package

      - name: Upload complete plugin package
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.platform }}-${{ matrix.arch }}
          path: plugin-package
          if-no-files-found: error

      - name: Prepare iroh runtime assets
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iroh-assets
          asset_base="iroh-runtime-${{ matrix.platform }}-${{ matrix.arch }}"

          native_paths=(plugin-package/node_modules/@number0/iroh-*/*.node)
          if [ "${#native_paths[@]}" -ne 1 ] || [ ! -f "${native_paths[0]}" ]; then
            echo "Expected exactly one iroh native binding, found ${#native_paths[@]}" >&2
            exit 1
          fi
          cp "${native_paths[0]}" "iroh-assets/${asset_base}.node"

          cd iroh-assets
          if command -v sha256sum &> /dev/null; then
            sha256sum "${asset_base}.node" > "${asset_base}.node.sha256"
          else
            shasum -a 256 "${asset_base}.node" > "${asset_base}.node.sha256"
          fi

      - name: Upload iroh runtime assets
        if: matrix.platform != 'darwin' || matrix.arch != 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: iroh-${{ matrix.platform }}-${{ matrix.arch }}
          path: iroh-assets
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            binaries/termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
            binaries/termy-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}.sha256

  build-agent:
    name: Build Agent ${{ matrix.platform }}-${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ''

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: release-agent-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --manifest-path agent/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p release-assets
          ASSET_NAME="termesh-agent-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "agent/target/${{ matrix.target }}/release/termesh-agent${{ matrix.ext }}" "release-assets/${ASSET_NAME}"

          cd release-assets
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          else
            shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/termesh-agent-*

  build-relay:
    name: Build Relay linux-x64
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
          key: release-relay-x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --manifest-path relay/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p release-assets
          cp relay/target/x86_64-unknown-linux-gnu/release/termy-relay release-assets/termy-relay-linux-x64
          cd release-assets
          sha256sum termy-relay-linux-x64 > termy-relay-linux-x64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: relay-linux-x64
          path: release-assets/termy-relay-linux-x64*

  release:
    name: Release
    needs: [build-rust, build-agent, build-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'server-*'
          path: binaries
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'agent-*'
          path: release-assets
          merge-multiple: true

      - name: Download relay binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'relay-*'
          path: release-assets
          merge-multiple: true

      - name: Download complete plugin packages
        uses: actions/download-artifact@v7
        with:
          pattern: 'plugin-*'
          path: complete-packages

      - name: Download iroh runtime assets
        uses: actions/download-artifact@v7
        with:
          pattern: 'iroh-*'
          path: release-assets
          merge-multiple: true

      - name: Set permissions
        run: |
          chmod +x binaries/termy-server-darwin-* || true
          chmod +x binaries/termy-server-linux-* || true
          chmod +x release-assets/termesh-agent-linux-* || true
          chmod +x release-assets/termy-relay-linux-* || true

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate release notes
        run: |
          node scripts/release-notes.js \
            --version "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --output release-body.md

      - name: Prepare release assets
        run: |
          set -euo pipefail

          # BRAT 需要的三个核心文件（直接上传，不打包）
          # main.js, manifest.json, styles.css 已在根目录
          
          # 设置二进制文件执行权限
          chmod +x binaries/termy-server-darwin-* || true
          chmod +x binaries/termy-server-linux-* || true
          
          # 原生 iroh 模块按平台分发，不能混装或省略。
          package_dirs=(complete-packages/plugin-*)
          if [ ! -d "${package_dirs[0]}" ]; then
            echo "No complete plugin packages were downloaded" >&2
            exit 1
          fi

          for package_dir in "${package_dirs[@]}"; do
            platform="${package_dir##*/plugin-}"
            test -f "${package_dir}/main.js"
            test -f "${package_dir}/manifest.json"
            test -f "${package_dir}/styles.css"
            test -f "${package_dir}/node_modules/@number0/iroh/package.json"
            find "${package_dir}/node_modules/@number0" -mindepth 2 -maxdepth 2 -type f -name '*.node' -print -quit | grep -q .
            (cd "${package_dir}" && zip -r "../../termesh-${{ github.ref_name }}-${platform}.zip" .)
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            termesh-${{ github.ref_name }}-*.zip
            release-assets/iroh-runtime-*.node
            binaries/termy-server-win32-x64.exe
            binaries/termy-server-darwin-arm64
            binaries/termy-server-darwin-x64
            binaries/termy-server-linux-x64
            binaries/termy-server-linux-arm64
            release-assets/termesh-agent-win32-x64.exe
            release-assets/termesh-agent-linux-x64
            release-assets/termy-relay-linux-x64

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
            termesh-${{ github.ref_name }}-*.zip
            release-assets/iroh-runtime-*.node
            release-assets/iroh-runtime-*.node.sha256
            binaries/termy-server-win32-x64.exe
            binaries/termy-server-win32-x64.exe.sha256
            binaries/termy-server-darwin-arm64
            binaries/termy-server-darwin-arm64.sha256
            binaries/termy-server-darwin-x64
            binaries/termy-server-darwin-x64.sha256
            binaries/termy-server-linux-x64
            binaries/termy-server-linux-x64.sha256
            binaries/termy-server-linux-arm64
            binaries/termy-server-linux-arm64.sha256
            release-assets/termesh-agent-win32-x64.exe
            release-assets/termesh-agent-win32-x64.exe.sha256
            release-assets/termesh-agent-linux-x64
            release-assets/termesh-agent-linux-x64.sha256
            release-assets/termy-relay-linux-x64
            release-assets/termy-relay-linux-x64.sha256
          body_path: release-body.md
          draft: false
          prerelease: false
