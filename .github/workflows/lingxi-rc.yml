name: LingXi RC Build

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact verified delivery commit SHA
        required: true
        type: string
      version:
        description: Candidate version (x.y.z-rc.N)
        required: true
        type: string
      artifact_path:
        description: Compatibility input for the Orchestrator RC template
        default: dist
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package RC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            agent: agent/target/release/lingxi1949
          - os: windows-latest
            agent: agent/target/release/lingxi1949.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Verify candidate identity
        shell: bash
        env:
          DELIVERY_SHA: ${{ inputs.sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$DELIVERY_SHA" =~ ^[0-9a-f]{40}$ && "$DELIVERY_SHA" == "$GITHUB_SHA" ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - name: Install Linux PTY build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libssl-dev
      - name: Package Obsidian plugin
        shell: bash
        working-directory: packages/obsidian-plugin
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build
          pnpm build:rust
          pnpm package
      - name: Package Remote
        shell: bash
        working-directory: packages/remote
        env:
          LINGXI_AGENT_BINARY: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-workspace
          cargo build --release --locked --manifest-path agent/Cargo.toml
          pnpm build
          pnpm package
      - name: Verify Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:orchestrator
          pnpm test:orchestrator
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ inputs.version }}-${{ github.sha }}-${{ runner.os }}
          path: packages/obsidian-plugin/plugin-package
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: remote-${{ inputs.version }}-${{ github.sha }}-${{ runner.os }}
          path: packages/remote/release-assets/*
          if-no-files-found: error
