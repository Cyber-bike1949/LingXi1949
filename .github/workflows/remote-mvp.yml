name: Remote MVP

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'protocol/**'
      - 'relay/**'
      - 'agent/**'
      - 'src/services/remote/**'
      - 'src/protocol/**'
      - 'rust-toolchain.toml'
      - 'e2e-run.sh'
      - 'e2e/**'
      - '.github/workflows/remote-mvp.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  protocol:
    name: Protocol contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install protocol tooling
        working-directory: protocol
        run: npm ci

      - name: Schemas, OpenAPI, fixtures and frame vectors
        working-directory: protocol
        run: npm test

      # Doc 8.1: generated files are checked in and must never be hand-edited,
      # so CI regenerates and fails on any diff.
      - name: Generated TypeScript is current
        working-directory: protocol
        run: |
          node tools/generate-typescript.js
          git diff --exit-code -- generated/typescript

      - name: Plugin copy of the generated types is current
        run: node scripts/sync-protocol.js --check

  rust:
    name: Relay and agent
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Keep this explicit version aligned with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            relay
            agent
            protocol/generated/rust

      - name: Format
        run: |
          cargo fmt --manifest-path relay/Cargo.toml --check
          cargo fmt --manifest-path agent/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path relay/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings

      - name: Protocol crate tests
        run: cargo test --manifest-path protocol/generated/rust/Cargo.toml

      - name: Relay tests
        run: cargo test --manifest-path relay/Cargo.toml

      - name: Agent tests
        run: cargo test --manifest-path agent/Cargo.toml

  generated-rust:
    name: Generated Rust is current
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      # There is no Cargo workspace at the repo root, so the default lookup
      # would find nothing to cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocol/generated/rust
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Separate job because installing cargo-typify costs several minutes and
      # should not sit in front of the test feedback.
      - name: Regenerate and diff
        working-directory: protocol
        run: |
          cargo install cargo-typify --locked
          node tools/generate-rust.js
          git diff --exit-code -- generated/rust/src/messages.rs

  agent-windows:
    name: Agent builds on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      # The Job Object teardown in pty.rs is Windows-only and never compiles on
      # the Linux development host, so this job is the first thing that checks
      # it at all. It does not prove the teardown works: that needs the manual
      # acceptance run on real hardware (doc 7.5).
      - name: Build
        run: cargo build --manifest-path agent/Cargo.toml

      - name: Test
        run: cargo test --manifest-path agent/Cargo.toml

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rust]

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Build agent
        run: cargo build --manifest-path agent/Cargo.toml

      # Installs @number0/iroh (and its platform-native optional dependency)
      # at the repo root - e2e/loopback-driver.cjs requires it from there, the
      # same resolution the plugin itself relies on (see package-plugin.js).
      - name: Install root dependencies (for @number0/iroh)
        run: pnpm install --frozen-lockfile

      # Starts a real agent in --loopback mode and drives a real terminal
      # session against it over iroh QUIC with the plugin's own binding
      # (doc A0 verdict: direct embedding). v2.0 has no relay any more -
      # `agent bind` was removed when client.rs (the V1 relay client) was
      # deleted - and no file-transfer protocol yet (Phase C), so this only
      # covers the terminal round trip; agent/src/serve.rs's own loopback
      # QUIC integration tests (`cargo test --manifest-path agent/Cargo.toml`)
      # cover more of the Rust side in isolation.
      - name: Terminal round trip (iroh loopback)
        run: ./e2e-run.sh

      - name: Agent log
        if: failure()
        run: cat /tmp/e2e/agent.log || true
