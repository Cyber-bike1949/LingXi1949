name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'README_ZH.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'README_ZH.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Build and test plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Check the generated protocol types are current
        run: node scripts/sync-protocol.js --check

      - name: Run terminal tests
        run: pnpm test:terminal

      - name: Run remote module tests
        run: pnpm test:remote

      - name: Run MCP tests
        run: pnpm test:mcp

      - name: Run script tests
        run: pnpm test:scripts

  remote-tasks:
    name: Agent and MCP integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --manifest-path agent/Cargo.toml
      - run: pnpm test:mcp:e2e
