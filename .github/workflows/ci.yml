name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'README_ZH.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'README.md'
      - 'README_ZH.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Build and test plugin
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Obsidian
        run: pnpm lint:obsidian

      - name: Build plugin
        run: pnpm build

      - name: Check the generated protocol types are current
        run: node scripts/sync-protocol.js --check

      - name: Run terminal tests
        run: pnpm test:terminal

      - name: Run remote module tests
        run: pnpm test:remote

      - name: Run script tests
        run: pnpm test:scripts
