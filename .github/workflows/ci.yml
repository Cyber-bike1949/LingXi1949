name: Monorepo CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/obsidian-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm build
      - run: pnpm lint:obsidian
      - run: pnpm test:terminal
      - run: pnpm test:remote
      - run: pnpm test:scripts

  remote:
    name: Remote product
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/remote
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm build
      - run: pnpm test
      - run: cargo fmt --manifest-path agent/Cargo.toml --check
      - run: cargo test --locked --manifest-path agent/Cargo.toml
      - run: pnpm test:e2e

  remote-installer:
    name: Remote installer
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/remote
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/install-remote.test.mjs
